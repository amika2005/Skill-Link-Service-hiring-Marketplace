plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.skilllink'
    compileSdk 34

    defaultConfig {
        applicationId "com.skilllink"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        def payHereMerchantId = project.hasProperty("payHereMerchantId") ? project.property("payHereMerchantId") : "4OVyIU3I3uq4JFncYduzz93LL"
        def payHereMerchantSecret = project.hasProperty("payHereMerchantSecret") ? project.property("payHereMerchantSecret") : "4TrWk3CeO1b48gwAPtme1s8W3xFeY5KVi8LWLqsJjVbv"
        def payHereReturnUrl = project.hasProperty("payHereReturnUrl") ? project.property("payHereReturnUrl") : "https://skilllink.app/payhere/return"
        def payHereCancelUrl = project.hasProperty("payHereCancelUrl") ? project.property("payHereCancelUrl") : "https://skilllink.app/payhere/cancel"
        def payHereNotifyUrl = project.hasProperty("payHereNotifyUrl") ? project.property("payHereNotifyUrl") : "https://skilllink.app/payhere/notify"
        def firestoreEnabled = project.hasProperty("firestoreEnabled") ? project.property("firestoreEnabled").toBoolean() : true

        buildConfigField "String", "PAYHERE_MERCHANT_ID", "\"${payHereMerchantId}\""
        buildConfigField "String", "PAYHERE_MERCHANT_SECRET", "\"${payHereMerchantSecret}\""
        buildConfigField "String", "PAYHERE_RETURN_URL", "\"${payHereReturnUrl}\""
        buildConfigField "String", "PAYHERE_CANCEL_URL", "\"${payHereCancelUrl}\""
        buildConfigField "String", "PAYHERE_NOTIFY_URL", "\"${payHereNotifyUrl}\""
        buildConfigField "boolean", "FIRESTORE_ENABLED", "${firestoreEnabled}"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
    kotlinOptions {
        jvmTarget = '11'
    }
    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
}

configurations.all {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.20'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.20'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.20'
        force 'org.jetbrains.kotlin:kotlin-stdlib-common:1.8.20'
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:34.3.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-storage'
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.6.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.1'
    implementation 'androidx.navigation:navigation-fragment:2.6.0'
    implementation 'androidx.navigation:navigation-ui:2.6.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'de.hdodenhof:circleimageview:3.1.0'
    implementation 'androidx.sqlite:sqlite:2.3.1'
    implementation 'com.airbnb.android:lottie:6.1.0'
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'
    implementation 'com.google.android.gms:play-services-maps:18.2.0'
    implementation 'com.google.firebase:firebase-auth:24.0.1'

    // Core library desugaring for JDK compatibility
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:1.2.2'

    // Kotlin dependencies with explicit versions to avoid conflicts
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.8.20"
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.20"
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.20"

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'androidx.test:core:1.5.0'
    testImplementation 'androidx.fragment:fragment-testing:1.6.2'
    testImplementation 'org.robolectric:robolectric:4.10.3'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
